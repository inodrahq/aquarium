<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aquarium — fork Sui mainnet locally">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f33"/>
      <stop offset="1" stop-color="#081726"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbcf0"/>
      <stop offset="0.55" stop-color="#3a87d8"/>
      <stop offset="1" stop-color="#1c5fa8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="tankclip"><rect x="700" y="44" width="452" height="232" rx="20"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="320" rx="28" fill="url(#card)"/>

  <!-- wordmark + tagline -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Inodra logo -->
    <svg x="60" y="54" width="67" height="56" viewBox="24 36 200 168" overflow="visible">
      <g transform="translate(-12.5, 20)" stroke="#ffffff" stroke-width="14" fill="none">
        <rect x="40" y="20" width="80" height="80" rx="12"/>
        <path d="M 120 100 L 120 180 L 80 180 L 80 120 L 40 120 L 40 180"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="135" y="60" width="80" height="80" transform="rotate(45 175 95)" rx="12"/>
      </g>
    </svg>
    <text x="144" y="108" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">Aquarium</text>
    <text x="60" y="160" font-size="27" font-weight="600" fill="#6fbcf0">Fork Sui mainnet locally.</text>
    <text x="60" y="196" font-size="19" fill="#9fb3c8">A contained, observable slice of the chain — execute</text>
    <text x="60" y="222" font-size="19" fill="#9fb3c8">real transactions against live state, no node required.</text>
    <!-- Inodra attribution -->
    <text x="60" y="270" font-size="19" font-weight="600" fill="#9fb3c8">An <tspan fill="#fff">Inodra</tspan> open-source project</text>
  </g>

  <!-- aquarium tank -->
  <g clip-path="url(#tankclip)">
    <rect x="700" y="44" width="452" height="232" fill="url(#water)"/>
    <!-- waterline -->
    <path d="M700 84 q56 -16 113 0 t113 0 t113 0 t113 0 v-60 h-565 z" fill="#0c1f33" opacity="0.35"/>
    <!-- sandy floor -->
    <path d="M700 250 q113 -22 226 0 t226 0 v40 h-452 z" fill="#0c1f33" opacity="0.5"/>
    <!-- plants -->
    <g fill="#2f8f6b" opacity="0.85">
      <path d="M760 256 q-14 -44 6 -82 q6 40 -6 82z"/>
      <path d="M780 256 q16 -54 -2 -96 q-10 48 2 96z"/>
      <path d="M1090 256 q14 -46 -4 -86 q-8 44 4 86z"/>
    </g>
    <!-- fish 1 -->
    <g transform="translate(880,150)">
      <path d="M0 0 q34 -26 70 0 q-34 26 -70 0z" fill="#ffd166"/>
      <path d="M0 0 l-22 -16 v32 z" fill="#ffb24d"/>
      <circle cx="52" cy="-4" r="4" fill="#0c1f33"/>
    </g>
    <!-- fish 2 (smaller) -->
    <g transform="translate(960,210) scale(0.7)">
      <path d="M0 0 q34 -26 70 0 q-34 26 -70 0z" fill="#ff8a5b"/>
      <path d="M0 0 l-22 -16 v32 z" fill="#ff6f43"/>
      <circle cx="52" cy="-4" r="4" fill="#0c1f33"/>
    </g>
    <!-- bubbles -->
    <g fill="#ffffff" opacity="0.5">
      <circle cx="820" cy="120" r="5"/>
      <circle cx="832" cy="92" r="3.5"/>
      <circle cx="826" cy="66" r="2.5"/>
      <circle cx="1050" cy="170" r="4"/>
      <circle cx="1058" cy="140" r="3"/>
    </g>
  </g>
  <!-- glass overlay + frame -->
  <rect x="700" y="44" width="452" height="232" rx="20" fill="url(#glass)"/>
  <rect x="700" y="44" width="452" height="232" rx="20" fill="none" stroke="#6fbcf0" stroke-opacity="0.55" stroke-width="2"/>
</svg>
