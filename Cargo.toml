[package]
name = "aquarium"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Fork Sui mainnet locally — a contained, observable slice of the chain for development."
repository = "https://github.com/inodrahq/aquarium"

[[bin]]
name = "aquarium"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Sui crates (reference: github.com/MystenLabs/sui @ testnet-v1.77.1) ---
# We depend on these as published git crates so this project stays fully
# standalone (it never links into a local Sui checkout). The execution engine
# and data-store traits are Mysten's; see NOTICE for attribution.
sui-data-store = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1" }
# Execution layer (heavy tree) — enabled once the read layer is validated.
sui-execution = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1", optional = true }
# Move VM execution trace format (for surfacing per-transaction traces).
move-trace-format = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1", optional = true }
prometheus = { version = "0.14", optional = true }

# --- gRPC façade (`serve` feature) ---
# Generated sui.rpc.v2 proto types + tonic server stubs, from Mysten's Rust SDK.
# The rev is chosen to match the sui-types tag above (BCS wire compatibility).
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "f383e14deec809886aa5e67ce734105a3883f1d4", optional = true }
sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "f383e14deec809886aa5e67ce734105a3883f1d4", optional = true }
bcs = { version = "0.1", optional = true }
serde = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tonic = { version = "0.14.2", optional = true }
tonic-reflection = { version = "0.14.2", optional = true }
# gRPC-Web + CORS so a browser (e.g. the Inodra explorer's localnet mode, which
# uses @mysten/sui's grpc-web transport) can talk to the fork directly.
tonic-web = { version = "0.14.2", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
prost-types = { version = "0.14.1", optional = true }
tokio-stream = { version = "0.1", optional = true }
# Anvil-style cheat control API (set clock / advance epoch / override objects).
# A small JSON/HTTP surface kept off the standard sui.rpc.v2 gRPC endpoint so
# that surface stays a faithful node twin.
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
# Bytecode parsing for MovePackageService (GetDatatype / GetFunction). Pinned to
# the same Sui tag as sui-types for CompiledModule wire compatibility.
move-binary-format = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1", optional = true }
move-core-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.77.1", optional = true }

[features]
# `execute` pulls in the Move VM / adapter so a fork can run new transactions.
# On by default so released/installed binaries can run transactions; build with
# `--no-default-features` for a lightweight read-only binary (no Sui VM tree).
default = ["execute", "serve"]
execute = ["dep:sui-execution", "dep:move-trace-format", "dep:prometheus"]
# `serve` exposes the fork over a local sui.rpc.v2 gRPC endpoint (`aquarium
# serve`) so standard tooling (grpcurl, SDKs) can talk to the fork like a node.
serve = [
    "execute",
    "dep:sui-rpc",
    "dep:sui-sdk-types",
    "dep:bcs",
    "dep:serde",
    "dep:tokio",
    "dep:tonic",
    "dep:tonic-reflection",
    "dep:tonic-web",
    "dep:tower-http",
    "dep:prost-types",
    "dep:tokio-stream",
    "dep:axum",
    "dep:base64",
    "dep:move-binary-format",
    "dep:move-core-types",
]

[profile.dev]
# The Sui execution tree is large; keep iteration tolerable.
debug = 0
