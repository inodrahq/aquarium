#
# Builds prebuilt `aquarium` binaries on each `v*` tag and attaches them (plus
# per-asset SHA-256 checksums) to the GitHub Release that `install.sh` reads.
#
# Native runners per architecture: the binary statically links the Sui Move VM,
# which pulls native C deps, so we avoid cross-compilation entirely.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_label }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,      os_label: macOS,  arch: arm64,  target: aarch64-apple-darwin }
          - { runner: macos-13,      os_label: macOS,  arch: x86_64, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04,  os_label: Linux,  arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, os_label: Linux, arch: arm64, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          asset="aquarium-${{ matrix.os_label }}-${{ matrix.arch }}.tar.gz"
          bin="target/${{ matrix.target }}/release/aquarium"
          tar -czf "$asset" -C "$(dirname "$bin")" aquarium
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
