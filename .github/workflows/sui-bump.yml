#
# Aquarium executes with the protocol versions compiled into the pinned Sui
# crates. This job runs daily and, per channel in channels.toml (mainnet,
# testnet, devnet), compares the recorded tag against MystenLabs' latest
# release for that channel. Only if a newer one exists does it bump
# channels.toml (plus Cargo.toml/Cargo.lock for the default testnet channel)
# and open a PR for review. No new release, no PR.
#
# Note: PRs created with the default GITHUB_TOKEN do not trigger the `ci`
# workflow. Set a classic PAT (repo scope) as the BUMP_PAT secret to get CI on
# the bump PRs automatically, or close/reopen the PR to trigger it manually.

name: sui-bump

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        channel: [mainnet, testnet, devnet]
    name: ${{ matrix.channel }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare channel pin with latest ${{ matrix.channel }} release
        id: version
        run: |
          set -euo pipefail
          pinned=$(grep '^${{ matrix.channel }} ' channels.toml | cut -d'"' -f2)
          latest=$(git ls-remote --tags https://github.com/MystenLabs/sui '${{ matrix.channel }}-v1.*' \
            | awk -F/ '{print $3}' | grep -v '\^{}$' | sort -V | tail -1)
          echo "pinned=$pinned latest=$latest"
          {
            echo "pinned=$pinned"
            echo "latest=$latest"
            if [ "$pinned" = "$latest" ] || [ -z "$latest" ]; then
              echo "bump=false"
            else
              echo "bump=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Bump channels.toml
        if: steps.version.outputs.bump == 'true'
        run: |
          set -euo pipefail
          sed -i 's/^${{ matrix.channel }} = ".*"/${{ matrix.channel }} = "${{ steps.version.outputs.latest }}"/' channels.toml
          grep '^${{ matrix.channel }} ' channels.toml

      # The repo's Cargo.toml pins the default (testnet) channel, so a testnet
      # bump also updates the manifest and lockfile.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.bump == 'true' && matrix.channel == 'testnet'
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.bump == 'true' && matrix.channel == 'testnet'
      - name: Bump Cargo.toml pins and Cargo.lock
        if: steps.version.outputs.bump == 'true' && matrix.channel == 'testnet'
        run: |
          set -euo pipefail
          sed -i "s/${{ steps.version.outputs.pinned }}/${{ steps.version.outputs.latest }}/g" Cargo.toml
          cargo update sui-types sui-data-store sui-execution

      - name: Open pull request
        if: steps.version.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BUMP_PAT || github.token }}
          branch: bump/sui-${{ steps.version.outputs.latest }}
          title: "Bump Sui ${{ matrix.channel }} channel: ${{ steps.version.outputs.pinned }} → ${{ steps.version.outputs.latest }}"
          commit-message: |
            deps: bump Sui ${{ matrix.channel }} channel to ${{ steps.version.outputs.latest }}

            Automated bump so the compiled-in protocol support keeps up with
            Mysten's ${{ matrix.channel }} releases.
          body: |
            Automated bump of the `${{ matrix.channel }}` channel from `${{ steps.version.outputs.pinned }}` to `${{ steps.version.outputs.latest }}`.

            Before merging:
            - [ ] CI is green — including the `channel-${{ matrix.channel }}` leg (upstream API breakage lands in `src/engine/vm.rs` first — see its history)
            - [ ] E2e smoke: `aquarium info`, `aquarium object --id 0x6`, `aquarium demo` against a live sender/coin
          reviewers: argos-inodra
          labels: dependencies
          delete-branch: true
