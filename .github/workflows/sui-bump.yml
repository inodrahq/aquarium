#
# Aquarium executes with the protocol versions compiled into the pinned Sui
# crates; when mainnet's protocol version passes the pin's max, `demo`/execute
# panics ("Please upgrade the binary"). This job runs daily, compares the
# pinned `mainnet-v*` tag against MystenLabs' latest mainnet release, and — only
# if a newer one exists — bumps Cargo.toml + Cargo.lock and opens a PR for
# review. Nothing is opened when the pin is already current.
#
# Note: PRs created with the default GITHUB_TOKEN do not trigger the `ci`
# workflow. Set a classic PAT (repo scope) as the BUMP_PAT secret to get CI on
# the bump PRs automatically, or close/reopen the PR to trigger it manually.

name: sui-bump

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned Sui tag with latest mainnet release
        id: version
        run: |
          set -euo pipefail
          pinned=$(grep -om1 'mainnet-v[0-9.]*' Cargo.toml)
          latest=$(git ls-remote --tags https://github.com/MystenLabs/sui 'mainnet-v1.*' \
            | awk -F/ '{print $3}' | grep -v '\^{}$' | sort -V | tail -1)
          echo "pinned=$pinned latest=$latest"
          {
            echo "pinned=$pinned"
            echo "latest=$latest"
            if [ "$pinned" = "$latest" ]; then echo "bump=false"; else echo "bump=true"; fi
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.bump == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.bump == 'true'

      - name: Bump Cargo.toml pins and Cargo.lock
        if: steps.version.outputs.bump == 'true'
        run: |
          set -euo pipefail
          sed -i "s/${{ steps.version.outputs.pinned }}/${{ steps.version.outputs.latest }}/g" Cargo.toml
          cargo update sui-types sui-data-store sui-execution

      - name: Open pull request
        if: steps.version.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BUMP_PAT || github.token }}
          branch: bump/sui-${{ steps.version.outputs.latest }}
          title: "Bump Sui crates: ${{ steps.version.outputs.pinned }} → ${{ steps.version.outputs.latest }}"
          commit-message: |
            deps: bump Sui crates to ${{ steps.version.outputs.latest }}

            Automated bump of the pinned MystenLabs Sui tag so the compiled-in
            max protocol version keeps up with live mainnet.
          body: |
            Automated bump of the pinned Sui crates from `${{ steps.version.outputs.pinned }}` to `${{ steps.version.outputs.latest }}`.

            If mainnet's protocol version has moved past the old pin's max supported
            version, `aquarium demo` / `Fork::execute` panics until this merges.

            Before merging:
            - [ ] CI is green on both feature sets (upstream API breakage lands in `src/engine/vm.rs` first — see its history)
            - [ ] E2e smoke: `aquarium info`, `aquarium object --id 0x6`, `aquarium demo` against a live sender/coin
          reviewers: argos-inodra
          labels: dependencies
          delete-branch: true
